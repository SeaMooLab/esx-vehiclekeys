<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>esx-vehiclekeys</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="container" aria-label="Vehicle key fob">
            <section class="fob">
                <div class="fob__ring"></div>
                <button type="button" data-action="lock" class="fob__button">Lock</button>
                <button type="button" data-action="unlock" class="fob__button">Unlock</button>
                <button type="button" data-action="trunk" class="fob__button">Trunk</button>
                <button type="button" data-action="engine" class="fob__button">Engine</button>
            </section>
        </main>
        <script src="script.js" type="text/javascript"></script>
    </body>
</html>
